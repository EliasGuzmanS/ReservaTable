{% extends "base.html" %}

{% block extra_head %}
<!-- Three.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
{% endblock %}

{% block content %}
<section class="hero-section">
    <h1>Reserva tu mesa ideal</h1>
    <p>Selecciona una mesa en nuestro mapa interactivo y asegura tu lugar en el restaurante.</p>
</section>

<section class="reservation-container">
    <div class="map-container">
        <!-- Contenedor para Three.js -->
        <div id="three-map"></div>
    </div>
    <div class="reservation-form">
        <h2>Detalles de Reserva</h2>
        <form id="reserveForm">
            <label>Mesa Seleccionada:</label>
            <input type="text" id="selectedTable" readonly placeholder="Toca una mesa en el mapa" required>
            <label>Fecha:</label>
            <input type="date" id="reserveDate" required>
            <label>Hora:</label>
            <input type="time" id="reserveTime" required>
            <label>Personas:</label>
            <input type="number" id="reservePeople" min="1" max="10" required>
            <button type="submit" class="btn-primary" id="btn-reserve">Reservar Mesa</button>
            <p id="reservationStatus" style="margin-top: 10px; font-weight: bold;"></p>
        </form>
    </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/map.js') }}"></script>
{% endblock %}
